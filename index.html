D.coso.n='UNCLOS Điều 5, 7 · Luật Biển Việt Nam 2012 Điều 8';D.coso.s=[['Khái niệm',['Đường cơ sở là đường gốc dùng để tính chiều rộng lãnh hải và các vùng biển khác của quốc gia ven biển.','Có hai loại: đường cơ sở thông thường (theo ngấn nước thủy triều thấp nhất dọc bờ) và đường cơ sở thẳng (nơi bờ biển khúc khuỷu hoặc có chuỗi đảo ven bờ).']],['Với Việt Nam',['Việt Nam dùng đường cơ sở thẳng, nối các điểm mốc trên đất liền và hải đảo bằng những đoạn thẳng.','Sơ đồ 24 điểm A1–A24 bắt đầu từ Hòn Nhạn (Thổ Chu), qua Hòn Đá Lẻ, Côn Đảo, Phú Quý, Lý Sơn, Cồn Cỏ… đến Điểm số 1 ở Vịnh Bắc Bộ.']],['Ý nghĩa',['Vùng nước phía trong đường cơ sở là nội thủy; vùng nước phía ngoài, đo từ đường này, là lãnh hải, tiếp giáp, đặc quyền kinh tế và thềm lục địa.']]];
D.noithuy.n='UNCLOS Điều 8 · Luật Biển Việt Nam 2012 Điều 9';D.noithuy.s=[['Khái niệm và phạm vi',['Vùng nước tiếp giáp với bờ biển, nằm bên trong đường cơ sở và là bộ phận lãnh thổ của quốc gia.','Gồm vùng nước cảng biển, vũng tàu, cửa sông, vịnh và vùng nước giữa bờ biển với đường cơ sở.']],['Chế độ pháp lý và quyền',['Chủ quyền hoàn toàn, tuyệt đối và đầy đủ đối với vùng nước, đáy biển, lòng đất dưới đáy biển và vùng trời phía trên, tương tự đất liền.','Tàu thuyền, phương tiện bay nước ngoài muốn ra vào, hoạt động phải xin phép trước và tuân thủ pháp luật của quốc gia ven biển.','Toàn quyền tài phán với vi phạm trên tàu nước ngoài; tàu quân sự và tàu nhà nước phi thương mại được miễn trừ tư pháp nhưng vẫn phải tuân thủ quy định ra vào, hoạt động.']],['Nghĩa vụ',['Công bố công khai quy định, thủ tục ra vào cảng biển và nội thủy.','Bảo đảm an toàn hàng hải, duy tu luồng lạch, tìm kiếm cứu nạn và bảo vệ môi trường biển.']]];
D.lanhhai.n='UNCLOS Điều 2, 3 · Luật Biển Việt Nam 2012 Điều 11, 12';D.lanhhai.s=[['Khái niệm và phạm vi',['Vùng biển rộng không vượt quá 12 hải lý (1 hải lý = 1.852 m) tính từ đường cơ sở ra phía biển.','Ranh giới phía ngoài của lãnh hải là biên giới quốc gia trên biển.']],['Chế độ pháp lý và quyền',['Chủ quyền đầy đủ và toàn vẹn đối với lãnh hải, vùng trời, đáy biển và lòng đất dưới đáy biển.','Ban hành luật lệ và kiểm soát: an toàn hàng hải, bảo vệ cáp ngầm, bảo tồn tài nguyên sinh vật, nghiên cứu khoa học, bảo vệ môi trường, phòng chống buôn lậu và nhập cư trái phép.']],['Nghĩa vụ: quyền đi qua không gây hại',['Phải tôn trọng quyền đi qua không gây hại của tàu thuyền nước ngoài: đi nhanh chóng, liên tục, không dừng hay thả neo (trừ sự cố bất khả kháng) và không phương hại hòa bình, trật tự, an ninh.','Tàu ngầm và phương tiện đi ngầm khác phải đi nổi và treo cờ quốc tịch.','Theo Luật Biển Việt Nam, tàu quân sự nước ngoài phải thông báo trước cho cơ quan có thẩm quyền.','Không được cản trở việc đi qua không gây hại và phải thông báo mọi nguy hiểm hàng hải đã biết.','Lưu ý: vùng trời trên lãnh hải thuộc chủ quyền tuyệt đối, phương tiện bay nước ngoài chưa được phép thì không có quyền bay qua.']]];
D.tiepgiap.n='UNCLOS Điều 33 · Luật Biển Việt Nam 2012 Điều 13, 14';D.tiepgiap.s=[['Khái niệm và phạm vi',['Vùng biển tiếp liền và nằm ngoài lãnh hải, rộng không quá 12 hải lý tính từ ranh giới ngoài lãnh hải (tối đa 24 hải lý từ đường cơ sở).']],['Chế độ pháp lý và quyền',['Không có chủ quyền lãnh thổ; quốc gia thực hiện quyền kiểm soát cần thiết.','Ngăn ngừa và trừng trị vi phạm về hải quan, thuế khóa, y tế và nhập cư xảy ra trên lãnh thổ hoặc trong lãnh hải.','Theo Luật Biển Việt Nam, còn kiểm soát các vi phạm về an ninh, quốc phòng và bảo vệ hiện vật khảo cổ, lịch sử.']],['Nghĩa vụ',['Tôn trọng quyền tự do hàng hải, tự do hàng không, tự do đặt cáp và ống dẫn ngầm của các quốc gia khác, vì về pháp lý vùng này chồng lên phần bên trong của vùng đặc quyền kinh tế.']]];
D.eez.n='UNCLOS Điều 55, 57 · Luật Biển Việt Nam 2012 Điều 15';D.eez.s=[['Khái niệm và phạm vi',['Vùng biển tiếp liền và nằm ngoài lãnh hải, hợp với lãnh hải thành vùng rộng tối đa 200 hải lý tính từ đường cơ sở.','Bản thân vùng đặc quyền kinh tế rộng tối đa 188 hải lý tính từ ranh giới ngoài lãnh hải.']],['Chế độ pháp lý và quyền',['Quyền chủ quyền về kinh tế: thăm dò, khai thác, quản lý và bảo tồn tài nguyên sinh vật (hải sản) và không sinh vật (khoáng sản, năng lượng nước, hải lưu, gió).','Quyền tài phán chuyên biệt: đảo nhân tạo, thiết bị và công trình trên biển; nghiên cứu khoa học biển; bảo vệ và gìn giữ môi trường biển.','Quyền thực thi pháp luật: khám xét, kiểm tra, bắt giữ và khởi tố tư pháp tàu nước ngoài đánh bắt hải sản hoặc khai thác tài nguyên trái phép.']],['Nghĩa vụ',['Tôn trọng tự do hàng hải, hàng không, đặt cáp và ống dẫn ngầm của mọi quốc gia, kể cả quốc gia không có biển.','Quản lý, bảo tồn nguồn lợi sinh vật biển, tránh khai thác quá mức.','Nếu không khai thác hết sản lượng cho phép, cần xem xét cho quốc gia khác khai thác phần dư thông qua điều ước quốc tế.']]];
D.them.n='UNCLOS Điều 76 · Luật Biển Việt Nam 2012 Điều 17';D.them.s=[['Khái niệm và phạm vi',['Gồm đáy biển và lòng đất dưới đáy biển bên ngoài lãnh hải, trên toàn bộ phần kéo dài tự nhiên của lãnh thổ đất liền đến bờ ngoài của rìa lục địa, hoặc đến cách đường cơ sở 200 hải lý nếu rìa lục địa ở gần hơn.','Nếu rìa lục địa kéo dài tự nhiên vượt 200 hải lý, có thể mở rộng nhưng không quá 350 hải lý từ đường cơ sở, hoặc không quá 100 hải lý từ đường đẳng sâu 2.500 m.','Chỉ gồm đáy biển và lòng đất, không gồm vùng nước bên trên.']],['Chế độ pháp lý và quyền',['Quyền chủ quyền về thăm dò và khai thác tài nguyên thiên nhiên.','Quyền có tính đặc quyền và đương nhiên: nếu quốc gia không thăm dò hay khai thác thì không ai được làm nếu chưa có sự đồng ý rõ ràng; không phụ thuộc chiếm hữu thực sự hay danh nghĩa, cũng không cần tuyên bố.','Tài nguyên gồm khoáng sản (dầu mỏ, khí đốt, kim loại…) và sinh vật loài định cư (san hô, trai, bào ngư…).','Có quyền tài phán đối với đảo nhân tạo và công trình trên thềm lục địa.']],['Nghĩa vụ',['Không được đụng chạm đến chế độ pháp lý của vùng nước hoặc vùng trời phía trên (vùng đặc quyền kinh tế hoặc biển cả).','Không cản trở vô lý việc hàng hải, đánh bắt cá, đặt và bảo dưỡng cáp, ống dẫn ngầm của quốc gia khác; tuyến ống dẫn ngầm phải được quốc gia ven biển thỏa thuận.','Với phần mở rộng vượt 200 hải lý: đóng góp bằng tiền hoặc hiện vật cho cộng đồng quốc tế thông qua Cơ quan Quyền lực Đáy đại dương (ISA) từ năm thứ 6 sau khi bắt đầu khai thác tài nguyên không sinh vật.']]];
D.bien={t:'Biển cả',c:'#7b8a97',r:'Ngoài các vùng biển thuộc quyền tài phán quốc gia',n:'Kiến thức bổ sung',m:['Là vùng biển nằm ngoài vùng đặc quyền kinh tế, thuộc cộng đồng quốc tế; không quốc gia nào được đặt chủ quyền.','Mọi quốc gia đều có quyền tự do hàng hải, hàng không, đặt cáp và ống dẫn ngầm.'],s:[]};
D.lanhhai.m.unshift('Đường vàng cam trên mô hình là biên giới quốc gia trên biển: ranh giới ngoài của lãnh hải, cách đường cơ sở 12 hải lý.');D.coso.m.unshift('Đường đỏ nối các chấm cam là đường cơ sở, ranh giới rất quan trọng: từ đây tính chiều rộng mọi vùng biển.');
D.hoangsa={t:'Quần đảo Hoàng Sa',c:'#29b6f6',r:'Ngoài khơi miền Trung, thuộc thành phố Đà Nẵng',n:'Theo sơ đồ minh họa',m:['Vùng biển quần đảo theo sơ đồ: 30.680 km².','Việt Nam khẳng định có đầy đủ bằng chứng lịch sử và cơ sở pháp lý về chủ quyền đối với quần đảo Hoàng Sa.','Các chấm cam là điểm mốc, đường xanh bao quanh quần đảo trên sơ đồ.'],s:[]};
D.truongsa={t:'Quần đảo Trường Sa',c:'#29b6f6',r:'Ngoài khơi Đông Nam, thuộc tỉnh Khánh Hòa',n:'Theo sơ đồ minh họa',m:['Vùng biển quần đảo theo sơ đồ: 250.800 km².','Việt Nam khẳng định có đầy đủ bằng chứng lịch sử và cơ sở pháp lý về chủ quyền đối với quần đảo Trường Sa.','Quần đảo gồm rất nhiều đảo, đá, bãi san hô nhỏ rải trong vùng biển rộng; các chấm trắng nhỏ trên mô hình là minh họa.'],s:[]};
D.tuchinh={t:'Bãi Tư Chính',c:'#b8892f',r:'Phía Đông Nam Vũng Tàu, dưới đáy biển',n:'Theo sơ đồ minh họa',m:['Là bãi ngầm nằm trong vùng đặc quyền kinh tế và thềm lục địa của Việt Nam.','Khu vực có tiềm năng dầu khí; Việt Nam có quyền chủ quyền về thăm dò, khai thác tài nguyên ở đây.'],s:[]};
var ORD=['coso','noithuy','lanhhai','tiepgiap','eez','them','bien','hoangsa','truongsa','tuchinh'];
var info=document.getElementById('info'),chips=document.getElementById('chips'),sel=null,selPt=-1;
function li(a){return '<ul>'+a.map(function(x){return '<li>'+x+'</li>';}).join('')+'</ul>';}
function mark(){[].forEach.call(chips.children,function(b){b.classList.toggle('on',b.dataset.id===sel);});}
function open(c,h,r,body){info.hidden=false;document.body.classList.add('open');info.style.setProperty('--ac',c);info.querySelector('h2').textContent=h;var e=info.querySelector('.rng');e.textContent=r;e.style.color=c;info.querySelector('.bd').innerHTML=body;info.scrollTop=0;}
function pick(id){var d=D[id];sel=id;selPt=-1;open(d.c,d.t,d.r,(d.n?'<div style="font-size:12px;color:var(--mute)">'+d.n+'</div>':'')+'<h3>Ý chính khi bấm</h3>'+li(d.m)+(d.s||[]).map(function(s){return '<h3>'+s[0]+'</h3>'+li(s[1]);}).join(''));
if(id==='them')document.getElementById('tWat').checked=false;mark();}
function pickPt(k){var b=B[k];sel='pts';selPt=k;open('#e0262d',b[0]+' – '+b[3],b[4],'<p>Một trong 24 điểm nối thành đường cơ sở của Việt Nam. Các điểm được nối bằng đoạn thẳng; vùng nước phía trong là nội thủy.</p>');mark();}
function pickList(){sel='pts';selPt=-1;var rows=B.slice().sort(function(a,b){return a[0].slice(1)-b[0].slice(1);}).map(function(b){var k=B.indexOf(b);return '<tr class="pt" data-k="'+k+'"><td><b>'+b[0]+'</b></td><td>'+b[3]+'</td><td>'+b[4]+'</td></tr>';}).join('');
open('#e0262d','24 điểm nối đường cơ sở','Bấm một dòng để xem điểm đó trên mô hình','<table><tr><th>Ký hiệu</th><th>Tên mốc</th><th>Vị trí</th></tr>'+rows+'</table>');
[].forEach.call(info.querySelectorAll('tr.pt'),function(r){r.onclick=function(){pickPt(+r.dataset.k);};});mark();}
info.querySelector('.x').onclick=function(){sel=null;selPt=-1;info.hidden=true;document.body.classList.remove('open');mark();};
ORD.forEach(function(id){var b=document.createElement('button');b.textContent=D[id].t;b.dataset.id=id;b.style.setProperty('--ac',D[id].c);b.onclick=function(){pick(id);};chips.appendChild(b);});
var pb=document.createElement('button');pb.textContent='24 điểm cơ sở';pb.dataset.id='pts';pb.style.setProperty('--ac','#e0262d');pb.onclick=pickList;chips.appendChild(pb);

/* điều khiển */
var rot=false,showLab=true,showWat=true,showCl=false;document.getElementById('tCl').onchange=function(e){showCl=e.target.checked;};
document.getElementById('tLab').onchange=function(e){showLab=e.target.checked;};
document.getElementById('tWat').onchange=function(e){showWat=e.target.checked;};
document.getElementById('tRot').onchange=function(e){rot=e.target.checked;};
document.getElementById('sMode').onchange=function(e){mode=e.target.value;build();};
var rc=new THREE.Raycaster(),dn=null;
cv.addEventListener('pointerdown',function(e){dn=[e.clientX,e.clientY];});
cv.addEventListener('pointerup',function(e){if(!dn||Math.hypot(e.clientX-dn[0],e.clientY-dn[1])>6)return;
var r=cv.getBoundingClientRect();rc.setFromCamera(new THREE.Vector2((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1),cam);
var hs=rc.intersectObjects(G.children,true);
for(var k=0;k<hs.length;k++){var u=hs[k].object.userData;if(!showLab&&hs[k].object.isSprite)continue;if(!showWat&&u.id&&ZN[u.id]&&ZN[u.id].water)continue;
if(u.pt!==undefined){pickPt(u.pt);return;}if(u.id){pick(u.id);return;}}});
/* quỹ đạo camera */
var th=-0.5,ph=0.85,rad=64,tgt=new THREE.Vector3(9,0,2),pts={},pd=0;
cv.addEventListener('pointerdown',function(e){cv.setPointerCapture(e.pointerId);pts[e.pointerId]=[e.clientX,e.clientY];});
cv.addEventListener('pointermove',function(e){if(!pts[e.pointerId])return;var k=Object.keys(pts);
if(k.length===1){th-=(e.clientX-pts[e.pointerId][0])*0.006;ph=Math.max(0.2,Math.min(1.5,ph-(e.clientY-pts[e.pointerId][1])*0.006));}
pts[e.pointerId]=[e.clientX,e.clientY];
if(k.length===2){var a=pts[k[0]],b=pts[k[1]],d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pd)rad=Math.max(12,Math.min(110,rad*pd/d));pd=d;}});
function up(e){delete pts[e.pointerId];pd=0;}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',function(e){e.preventDefault();rad=Math.max(12,Math.min(110,rad*(1+e.deltaY*0.001)));},{passive:false});
function size(){var w=innerWidth,h=innerHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.fov=w<h?62:40;cam.updateProjectionMatrix();}
addEventListener('resize',size);size();
var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
function loop(t){requestAnimationFrame(loop);
if(rot&&!reduce)th+=0.003;
if(!reduce){var tt=t*0.0016;WV.forEach(function(m){var a=m.geometry.attributes.position,ar=a.array,y0=m.userData.y0;for(var u=0;u<ar.length;u+=3)ar[u+1]=y0+0.022*Math.sin(ar[u]*1.7+ar[u+2]*1.1+tt*3);a.needsUpdate=true;});
MV.forEach(function(m){m.row+=m.sp;if(m.row>N-8)m.row=8;if(m.row<8)m.row=N-8;var k=m.row|0,f=m.row-k,p=at(k,m.d,0.14).lerp(at(k+1,m.d,0.14),f);p.y+=Math.sin(t*0.002+m.row)*0.03;m.g.position.copy(p);m.g.rotation.y=-Math.atan2(SP[k+1].z-SP[k].z,SP[k+1].x-SP[k].x)+(m.sp<0?Math.PI:0);m.g.rotation.z=Math.sin(t*0.0016+m.row)*0.05;});
CL.forEach(function(c){c.position.x+=c.userData.sp;if(c.position.x>22)c.position.x=-14;});
if(FLG){var fa=FLG.geometry.attributes.position,fr=fa.array;for(var u2=0;u2<fr.length;u2+=3)fr[u2+2]=Math.sin(fr[u2]*6-t*0.006)*0.09*(fr[u2]+0.6);fa.needsUpdate=true;}
BD.forEach(function(b){var an=t*b.sp+b.ph;b.g.position.set(b.c.x+Math.cos(an)*b.r,b.c.y+Math.sin(an*2)*0.12,b.c.z+Math.sin(an)*b.r);b.g.rotation.y=Math.atan2(-Math.sin(an),Math.cos(an));var fl=Math.sin(t*0.012+b.ph)*0.6;b.w1.rotation.z=fl;b.w2.rotation.z=-fl;});}
CL.forEach(function(c){c.visible=showCl;});SEA.material.opacity=sel==='them'?0.15:0.8;SEA.visible=showWat;
for(var k in ZN){var z=ZN[k],o=z.op;if(sel==='them'&&z.water)o=0.18;if(k===sel)o=Math.min(1,o+(reduce?0.15:0.2+Math.sin(t*0.004)*0.08));
if(z.m.material.transparent)z.m.material.opacity=o;z.m.visible=z.water?showWat:true;}
ZN.them.m.material.emissive.setHex(sel==='them'?0x4a3200:0);
PT.forEach(function(p,k){p.scale.setScalar(k===selPt?1.7:1);});
LB.forEach(function(l){l.visible=showLab;});
cam.position.set(tgt.x+rad*Math.sin(ph)*Math.sin(th),tgt.y+rad*Math.cos(ph),tgt.z+rad*Math.sin(ph)*Math.cos(th));cam.lookAt(tgt);R.render(S,cam);}
requestAnimationFrame(loop);
})();
</script></body></html>
